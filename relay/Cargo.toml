[package]
name = "atlas-relay"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ciborium = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
schemars = "1.2.1"
redis = { version = "1.4.1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "script",
] }

[dev-dependencies]
futures-util = { workspace = true }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
